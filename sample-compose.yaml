services:
  app-one:
    image: node:20-alpine
    container_name: node-app-one
    restart: unless-stopped
    working_dir: /usr/src/app
    user: "1000:1000"
    volumes:
      - /pool0/storage/node-apps/app-one:/usr/src/app
    ports:
      - "3333:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=app-one
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: sh -c "npm install --omit=dev && npm start"
    networks:
      - node-net

networks:
  node-net:
    driver: bridge